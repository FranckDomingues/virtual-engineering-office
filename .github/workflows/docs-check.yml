name: docs-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  required-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check governance files
        run: |
          set -euo pipefail
          for f in governance/ENGINEERING_CONSTITUTION.md governance/HEXAGONAL_STANDARD.md governance/SECURITY_BASELINE.md governance/HUMAN_APPROVAL_POLICY.md; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
